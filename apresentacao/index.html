<title>Plataforma Trackers Lagoinha</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: faixa azul-marinho de abertura com a plataforma em uso; depois seções claras alternadas, cada uma com um quadro interativo; fecho em azul-marinho com o botão de acesso. */
:root{
  --navy:#101f47; --navy2:#1b3070; --ink:#14203d; --mut:#586079; --bg:#f4f5f8; --surface:#ffffff; --line:#d9dce6;
  --or:#e8641a; --or-ink:#b84a0c; --sky:#2a9fd8; --on-navy:#f3f5fa; --on-navy-mut:#aab4d0; --navy-line:#2b3d74;
  --chip:#eceef4; --shadow:0 18px 50px rgba(16,31,71,.13);
  --f-d:"Archivo","Noto Sans SC","PingFang SC","Microsoft YaHei",Arial,sans-serif;
  --f-b:"Inter","Noto Sans SC","PingFang SC","Microsoft YaHei",Arial,sans-serif;
  --f-m:"JetBrains Mono","Noto Sans Mono CJK SC",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --navy:#0a1330; --navy2:#16255a; --ink:#e9ecf5; --mut:#a0a9c2; --bg:#0d1326; --surface:#151d38; --line:#2a3558;
  --or:#f47b34; --or-ink:#ff9a5e; --sky:#58bdf0; --on-navy:#f3f5fa; --on-navy-mut:#aab4d0; --navy-line:#26366b;
  --chip:#1d2747; --shadow:0 18px 50px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --navy:#0a1330; --navy2:#16255a; --ink:#e9ecf5; --mut:#a0a9c2; --bg:#0d1326; --surface:#151d38; --line:#2a3558;
  --or:#f47b34; --or-ink:#ff9a5e; --sky:#58bdf0; --on-navy:#f3f5fa; --on-navy-mut:#aab4d0; --navy-line:#26366b;
  --chip:#1d2747; --shadow:0 18px 50px rgba(0,0,0,.45); color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{background:var(--bg);color:var(--ink);font-family:var(--f-b);font-size:16px;line-height:1.6;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--navy)}
h1,h2,h3{font-family:var(--f-d);text-wrap:balance;margin:0;letter-spacing:-.01em}
p{margin:0}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px;border-radius:6px}
.wrap{max-width:1160px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.eyebrow{font-family:var(--f-m);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--or-ink)}
.sec{padding-block:76px}
.sec h2{font-size:clamp(28px,3.4vw,42px);font-stretch:112%;font-weight:750;line-height:1.1;margin-top:10px;max-width:24ch}
.sec .lead{color:var(--mut);max-width:62ch;margin-top:14px;font-size:17px}
.sec.alt{background:var(--surface);border-block:1px solid var(--line)}
.small{font-size:13.5px;color:var(--mut)}

/* topo */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--navy) 92%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--navy-line);color:var(--on-navy)}
.top .wrap{display:flex;align-items:center;gap:18px;padding-block:10px}
.top img{height:30px;width:auto;display:block}
.top nav{display:flex;gap:18px;margin-left:auto;font-size:14px}
.top nav a{text-decoration:none;color:var(--on-navy-mut);white-space:nowrap}
.top nav a:hover{color:var(--on-navy)}
.lang{display:flex;border:1px solid var(--navy-line);border-radius:999px;padding:2px;flex:none}
.lang button{background:none;border:0;border-radius:999px;padding:4px 11px;font-size:13px;color:var(--on-navy-mut)}
.lang button[aria-pressed="true"]{background:var(--on-navy);color:var(--navy)}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--or);color:#fff;border:0;border-radius:999px;padding:11px 20px;font-weight:600;text-decoration:none;font-size:15px;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:none;border:1px solid var(--navy-line);color:var(--on-navy)}
.btn.sm{padding:7px 14px;font-size:13.5px}

/* abertura */
.hero{background:radial-gradient(1100px 520px at 88% -10%,#27408c 0%,transparent 60%),radial-gradient(700px 420px at 0% 110%,#8a3c18 0%,transparent 62%),var(--navy);color:var(--on-navy);overflow:hidden}
.hero-main{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:44px;align-items:center;padding-block:64px 52px}
.hero .eyebrow{color:#f59a5c}
.hero h1{font-size:clamp(34px,4.6vw,60px);font-stretch:116%;font-weight:800;line-height:1.03;margin-top:14px}
.hero h1 em{font-style:normal;color:#f59a5c}
.hero p.sub{margin-top:18px;color:var(--on-navy-mut);font-size:18px;max-width:46ch}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}
.frame{background:#0b1430;border:1px solid var(--navy-line);border-radius:14px;box-shadow:0 30px 80px rgba(0,0,0,.45);overflow:hidden;min-width:0}
.frame .bar{display:flex;align-items:center;gap:6px;padding:9px 12px;border-bottom:1px solid var(--navy-line);font-family:var(--f-m);font-size:11.5px;color:var(--on-navy-mut)}
.frame .bar i{width:9px;height:9px;border-radius:50%;background:#3a4a80;display:block;flex:none}
.frame .bar span{margin-left:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frame video{display:block;width:100%;height:auto;aspect-ratio:16/9;background:#0b1430}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--navy-line)}
.facts div{padding:20px 18px 30px 0;min-width:0}
.facts div+div{border-left:1px solid var(--navy-line);padding-left:20px}
.facts b{font-family:var(--f-d);font-stretch:112%;font-size:clamp(26px,3vw,38px);font-weight:750;display:block;font-variant-numeric:tabular-nums;line-height:1.15}
.facts span{font-size:13.5px;color:var(--on-navy-mut);display:block;margin-top:4px;max-width:26ch}

























/* antes / depois */
.swap{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;margin-top:26px;background:var(--surface)}
.swap button{border:0;background:none;border-radius:999px;padding:8px 18px;font-weight:600;font-size:14.5px;color:var(--mut)}
.swap button[aria-pressed="true"]{background:var(--navy);color:var(--on-navy)}
.cmp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:22px}
.cmp article{border-top:3px solid var(--line);padding-top:16px;min-width:0}
.cmp.now article{border-top-color:var(--or)}
.cmp h3{font-size:18px;font-weight:700}
.cmp p{color:var(--mut);margin-top:6px;font-size:15px}
.sim{margin-top:44px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:26px;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:30px;align-items:center}
.sim h3{font-size:22px;font-weight:750;font-stretch:108%}
.sim p{color:var(--mut);font-size:15px;margin-top:8px}
.sim label{display:block;font-family:var(--f-m);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--or-ink)}
.sim input[type=range]{width:100%;margin:12px 0 4px;accent-color:var(--or)}
.simo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;margin-top:10px;border-top:1px solid var(--line)}
.simo div{padding:12px 12px 0 0;min-width:0}
.simo div+div{border-left:1px solid var(--line);padding-left:14px}
.simo b{font-family:var(--f-d);font-stretch:110%;font-size:clamp(24px,2.6vw,34px);font-weight:750;display:block;font-variant-numeric:tabular-nums;line-height:1.15}
.simo span{font-size:13px;color:var(--mut)}

/* fluxo */
.flow{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,7fr);gap:28px;margin-top:34px;align-items:start}
.steps{display:flex;flex-direction:column;gap:4px;list-style:none;margin:0;padding:0}
.steps button{width:100%;text-align:left;display:flex;gap:12px;align-items:center;background:none;border:1px solid transparent;border-radius:10px;padding:10px 12px}
.steps button .n{font-family:var(--f-m);font-size:12px;color:var(--mut);width:22px;flex:none}
.steps button .d{width:12px;height:12px;border-radius:3px;flex:none;background:var(--c)}
.steps button .t{font-weight:600;font-size:15.5px}
.steps button:hover{background:var(--chip)}
.steps button[aria-current="step"]{background:var(--bg);border-color:var(--line)}
.stage{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:26px;min-width:0}
.tag{font-family:var(--f-m);font-size:12px;color:var(--mut);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.row56{display:grid;grid-template-columns:repeat(57,minmax(0,1fr));gap:2px;margin:12px 0 6px}
.row56 i{display:block;aspect-ratio:1/2.1;background:var(--c);border-radius:1px;transition:background .35s;transition-delay:calc(var(--i)*6ms)}
.row56 i.tcu{background:var(--ink)}
.stat{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:4px 12px;margin-top:8px;background:var(--surface)}
.stat::before{content:"";width:10px;height:10px;border-radius:2px;background:var(--c);flex:none}
.stage h3{font-size:24px;font-weight:750;font-stretch:108%;margin-top:18px}
.stage p.x{margin-top:8px;color:var(--mut)}
.stage dl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:20px 0 0}
.stage dt{font-family:var(--f-m);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--or-ink)}
.stage dd{margin:4px 0 0;font-size:14.5px}
.stage .nav{display:flex;justify-content:space-between;gap:10px;margin-top:22px;border-top:1px solid var(--line);padding-top:14px}
.stage .nav button{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px}
.stage .nav button:disabled{opacity:.4;cursor:default}

/* demonstração */
.demo{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,8fr);gap:26px;margin-top:34px;align-items:start}
.tabs{display:flex;flex-direction:column;gap:8px}
.tabs button{text-align:left;background:none;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.tabs button b{display:block;font-family:var(--f-d);font-size:17px}
.tabs button span{display:block;color:var(--mut);font-size:14px;margin-top:2px}
.tabs button[aria-selected="true"]{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.tabs button[aria-selected="true"] span{color:var(--on-navy-mut)}
.demo .frame{box-shadow:var(--shadow)}
.demo .capt{font-size:14.5px;color:var(--mut);margin-top:12px;max-width:70ch}

/* módulos */










/* benefícios */
.ben{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,8fr);gap:30px;margin-top:34px;align-items:start}
.ben .tabs button{border-radius:999px;padding:10px 18px;font-weight:600}
.benx{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 30px}
.benx article{border-left:3px solid var(--or);padding-left:16px;min-width:0}
.benx h3{font-size:18px;font-weight:700}
.benx p{color:var(--mut);font-size:15px;margin-top:4px}

/* perfis */
.roles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-top:30px;border-top:1px solid var(--line)}
.roles div{padding:18px 18px 0 0;min-width:0}
.roles div+div{border-left:1px solid var(--line);padding-left:18px}
.roles b{font-family:var(--f-d);font-size:20px;display:block}
.roles i{font-style:normal;font-family:var(--f-m);font-size:11.5px;letter-spacing:.1em;color:var(--or-ink);text-transform:uppercase}
.roles p{font-size:14.5px;color:var(--mut);margin-top:6px}

/* fecho */
.end{background:radial-gradient(900px 420px at 10% 110%,#8a3c18 0%,transparent 60%),var(--navy);color:var(--on-navy)}
.end .wrap{padding-block:84px;display:grid;grid-template-columns:minmax(0,7fr) minmax(0,4fr);gap:30px;align-items:center}
.end h2{font-size:clamp(30px,4vw,50px);font-stretch:114%;font-weight:800;line-height:1.05}
.end p{color:var(--on-navy-mut);margin-top:14px;max-width:52ch}
.end .box{border:1px solid var(--navy-line);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.end .box .btn{font-size:17px;padding:14px 26px}
.end .box span{font-size:13.5px;color:var(--on-navy-mut)}
footer{background:var(--navy);color:var(--on-navy-mut);border-top:1px solid var(--navy-line);font-size:13px}
footer .wrap{padding-block:18px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

@media (max-width:1000px){.top nav{display:none}.lang{margin-left:auto}}
@media (max-width:900px){
  .hero-main,.flow,.demo,.ben,.end .wrap,.sim{grid-template-columns:minmax(0,1fr)}
  .hero-main{padding-block:44px 40px;gap:30px}
  
  .cmp,.stage dl,.benx{grid-template-columns:minmax(0,1fr)}
  .steps,.tabs{flex-direction:row;overflow-x:auto;padding-bottom:6px}
  .steps button,.tabs button{white-space:nowrap;flex:none;width:auto}
  .tabs button span{display:none}
  .facts,.roles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .facts div:nth-child(3),.roles div:nth-child(3){border-left:0;padding-left:0}
  .facts div:nth-child(n+3){border-top:1px solid var(--navy-line)}
  .roles div:nth-child(n+3){border-top:1px solid var(--line);margin-top:18px}
  .sec{padding-block:52px}
  .end .wrap{padding-block:56px}
  .stage,.sim{padding:20px}
}
@media (max-width:480px){.top img{height:24px}.top .wrap{gap:10px}.lang button{padding:4px 8px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.row56 i{transition:none}}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand .dev{font-family:var(--f-m);font-size:11px;letter-spacing:.04em;color:var(--on-navy-mut);border-left:1px solid var(--navy-line);padding-left:12px;white-space:nowrap}
@media (max-width:900px){.brand{flex-direction:column;align-items:flex-start;gap:2px}.brand .dev{border-left:0;padding-left:0;font-size:10px}}
@media (max-width:640px){.brand .dev{display:none}}
.omd{display:block;margin-top:4px;opacity:.85}
.mbox{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:28px;margin-top:34px;align-items:start}
.mnav{display:flex;flex-direction:column;gap:18px;position:sticky;top:84px}
.mgrp{display:flex;flex-direction:column;gap:2px}
.mgl{font-family:var(--f-m);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--or-ink);margin-bottom:4px}
.mnav button{text-align:left;background:none;border:0;border-left:2px solid var(--line);padding:8px 12px;font:600 15.5px var(--f-d);color:var(--mut);cursor:pointer}
.mnav button:hover{color:var(--ink);border-left-color:var(--mut)}
.mnav button[aria-selected="true"]{color:var(--ink);border-left-color:var(--or);background:var(--chip)}
.mpane{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:30px;display:grid;grid-template-columns:minmax(0,1fr);gap:28px}
.mpane.has-img{grid-template-columns:minmax(0,5fr) minmax(0,6fr);align-items:center}
@media (min-width:901px){.mpane{min-height:430px;align-content:start}.mpane.has-img{align-content:center}}
.mtx{display:flex;flex-direction:column;gap:12px;min-width:0}
.mtx h3{font:700 clamp(22px,2.4vw,30px)/1.15 var(--f-d);margin:0;text-wrap:balance}
.msum{font-size:16.5px;line-height:1.55;margin:0;color:var(--ink)}
.mlist{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:9px}
.mlist li{position:relative;padding-left:26px;font-size:15px;line-height:1.5;color:var(--mut)}
.mlist li::before{content:"";position:absolute;left:2px;top:.42em;width:12px;height:7px;border-left:2px solid var(--or);border-bottom:2px solid var(--or);transform:rotate(-45deg)}
.mwho{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px;padding-top:14px;border-top:1px solid var(--line)}
.mwl{font-family:var(--f-m);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-right:4px}
.mchip{font-size:13px;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--surface)}
.mfig{margin:0;border-radius:12px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow);background:var(--surface)}
.mfig img{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:cover;object-position:top left}
@media (max-width:900px){.mbox{grid-template-columns:minmax(0,1fr);gap:16px}.mnav{position:static;flex-direction:row;overflow-x:auto;gap:14px;padding-bottom:6px;scrollbar-width:thin}.mgrp{flex:none}.mnav button{white-space:nowrap;border-left:0;border-bottom:2px solid var(--line);padding:6px 10px}.mnav button[aria-selected="true"]{border-bottom-color:var(--or)}.mgrp{flex-direction:row;align-items:flex-end;flex-wrap:nowrap}.mgrp .mgl{display:none}.mpane,.mpane.has-img{grid-template-columns:minmax(0,1fr);padding:20px;min-height:0}}
.origin{margin-top:26px;display:flex;flex-direction:column;gap:8px;border-left:3px solid var(--or);padding:2px 0 2px 16px;max-width:62ch}
.origin p{margin:0;font-size:14.5px;line-height:1.55;color:var(--on-navy-mut)}
.origin p:first-child{color:var(--on-navy)}
</style>

<section class="sec" id="contexto"><div class="wrap">

  const s=STEPS[step],L=s[lang],g=$('#stage');const tag=el('div','tag');tag.append(el('span',null,'LAG01_CAB03_INV02-TK008'),el('span',null,D.rowlbl));
  let row=g.querySelector('.row56');if(!row){row=el('div','row56');for(let i=0;i<57;i++){const c=el('i',i===28?'tcu':null);c.style.setProperty('--i',i);row.append(c);}}

  const nav=el('div','nav');const pv=el('button',null,'← '+D.prev),nx=el('button',null,D.next+' →');pv.type=nx.type='button';pv.id='st-prev';nx.id='st-next';pv.disabled=step===0;nx.disabled=step===STEPS.length-1;pv.onclick=()=>{step--;rFlow(true);};nx.onclick=()=>{step++;rFlow(true);};nav.append(pv,nx);
